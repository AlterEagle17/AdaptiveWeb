# ==============================================================================
# AdaptiveWeb — Spring Boot Application Properties
# ==============================================================================
server.port=8080
spring.application.name=adaptiveweb

# ==============================================================================
# DEFAULT DATABASE: In-Memory H2 (Instant development & hackathon demo out-of-the-box)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:adaptivewebdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==============================================================================
# PRODUCTION DATABASE: MySQL (Uncomment below to connect to MySQL database)
# ==============================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/adaptiveweb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
